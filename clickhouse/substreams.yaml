specVersion: v0.1.0
package:
  name: hypercore_clickhouse
  version: v0.2.1
  url: https://github.com/pinax-network/substreams-hypercore
  description: Hypercore (ClickHouse)
  image: ../image.png

imports:
  sql: ../spkg/substreams-sink-sql-protodefs-v1.0.7.spkg
  db: ../spkg/hypercore-v0.2.1.spkg

modules:
  - name: db_out
    use: db:db_out

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./schema.sql"
    engine: clickhouse
    postgraphile_frontend:
      enabled: false

network: hyprecore
