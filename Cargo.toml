[package]
name = "hypercore"
description = "HyperCore Substreams"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["substreams"]
legacy-rows = ["dep:substreams", "dep:substreams-database-change"]
substreams = ["legacy-rows", "dep:substreams-abis", "dep:substreams-ethereum"]

[dependencies]
prost = "0.13"
prost-types = "0.13"

# Preserve the deployed WASM SDK while avoiding duplicate allocator exports when
# native consumers already link the current SDK through other shared decoders.
[target.'cfg(target_arch = "wasm32")'.dependencies]
substreams = { version = "0.7.0", optional = true }
substreams-database-change = { version = "3.0.0", optional = true }
substreams-abis = { git = "https://github.com/pinax-network/substreams-abis.git", rev = "65c72746864f1189fca7de488934ca8d945b5e76", optional = true }
substreams-ethereum = { version = "0.11.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
substreams = { version = "0.8.0", optional = true }
substreams-database-change = { version = "5.0.0", optional = true }

[dev-dependencies]
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"

[profile.release]
lto = true
